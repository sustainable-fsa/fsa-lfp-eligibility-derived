# Canonical archive-update workflow (sustainable-fsa S3 migration).
name: update
run-name: Update the fsa-lfp-eligibility-derived archive → S3

on:
  schedule:
    # fallback only; normally dispatched from
    # sustainable-fsa/usdm-counties-census-2020
    - cron: '20 22 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Run even when the freshness precheck sees nothing new upstream.
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['**.R', '.github/workflows/**']

permissions:
  id-token: write
  contents: write # commit-back of rendered README and QA report

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Decide whether there is anything to do before the macOS runner and the
  # geospatial toolchain spin up. This archive joins all four USDM county
  # aggregations, so a week is workable only once *every* one of them has
  # published it — the same "posted by all four" condition the R script applies
  # per week, hoisted ahead of the S3 pull. The in-script gate remains the local
  # authority once `update` starts.
  #
  # The gate fails OPEN: it skips only on a definite answer (a 404 in some
  # upstream, or the week already present here). A probe that itself fails
  # leaves `proceed` true, so a network blip costs a redundant run rather than
  # silently stalling the archive.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          BASE: https://data.sustainable-fsa.com
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # Code changes and an explicit force always run; only the scheduled
          # and dispatched cascade paths are gated.
          if [ "$EVENT" = push ] || [ "$FORCE" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest USDM Tuesday at least two days old — mirrors usdm_get_dates().
          wk=
          for i in $(seq 2 15); do
            d=$(date -u -d "$i days ago" +%F)
            if [ "$(date -u -d "$d" +%u)" = 2 ]; then wk="$d"; break; fi
          done

          probe() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 \
              -I "$1" 2>/dev/null | tail -c 3
          }

          missing=0
          unknown=0
          for a in usdm-counties usdm-counties-fsa-lfp usdm-counties-reported \
                   usdm-counties-census-2020; do
            c=$(probe "$BASE/$a/data/usdm/USDM_$wk.parquet")
            echo "  $a: $c"
            case "$c" in
              200) ;;
              404) missing=$((missing + 1)) ;;
              *)   unknown=$((unknown + 1)) ;;
            esac
          done

          mine=$(probe "$BASE/fsa-lfp-eligibility-derived/data/usdm/USDM_$wk.parquet")
          echo "week=$wk missing=$missing unknown=$unknown mine=$mine"

          # A skip on a dispatched run is worth flagging: whatever dispatched us
          # should already have published the week.
          lvl=notice
          if [ "$EVENT" = workflow_dispatch ]; then lvl=warning; fi

          if [ "$unknown" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" -gt 0 ]; then
            echo "::${lvl}::$wk is not yet posted by all four upstream archives; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$mine" = 200 ]; then
            echo "::notice::$wk is already present in this archive; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    # `always()` so a precheck that errors outright does not skip the archive:
    # only an explicit `false` gates the run. The precheck is an optimisation,
    # never a dependency.
    if: always() && needs.precheck.outputs.proceed != 'false'
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: fsa-lfp-eligibility-derived
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript fsa-lfp-eligibility-derived.R

      # Commit the reanalysis, the QA report and the rendered README back to git;
      # the CSV, Parquet and JSON are mirrored here as well as on S3. The gate
      # reads the CSV rather than the Parquet: Parquet output is not
      # byte-reproducible, so it would register a change on every run. The JSON
      # is byte-reproducible, so it is gated directly. PNG byte-noise alone
      # never triggers a commit either.
      - name: Commit refreshed archive
        run: |
          if git diff --quiet -- fsa-lfp-eligibility-derived.csv fsa-lfp-eligibility-derived.json README.md qa-report.txt; then
            echo "Reanalysis, QA report and README unchanged; skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fsa-lfp-eligibility-derived.csv \
                  fsa-lfp-eligibility-derived.parquet \
                  fsa-lfp-eligibility-derived.json \
                  qa-report.txt README.md example-1.png
          git commit -m 'Update archive'
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::notice::README render superseded by a concurrent run; skipping commit."
            exit 0
          fi
          git push
